server.port=8080
spring.application.name=gateway

spring.cloud.gateway.server.webmvc.routes[0].id=artist
spring.cloud.gateway.server.webmvc.routes[0].uri=${ARTIST_SERVICE_URL:http://artist:8080}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/artist/**

spring.cloud.gateway.server.webmvc.routes[1].id=booking-category
spring.cloud.gateway.server.webmvc.routes[1].uri=${BOOKING_CATEGORY_SERVICE_URL:http://booking-category:8080}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/category/**

spring.cloud.gateway.server.webmvc.routes[2].id=concert-event
spring.cloud.gateway.server.webmvc.routes[2].uri=${CONCERT_EVENT_SERVICE_URL:http://concert-event:8080}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/events/**

spring.cloud.gateway.server.webmvc.routes[3].id=promo-media
spring.cloud.gateway.server.webmvc.routes[3].uri=${PROMO_MEDIA_SERVICE_URL:http://promo-media:8080}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/media/**

management.endpoints.web.exposure.include=health
