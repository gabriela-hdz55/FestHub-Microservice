server.port=${SERVER_PORT:8080}
spring.application.name=concert-event

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate

management.endpoints.web.exposure.include=health

services.category.url=${BOOKING_CATEGORY_SERVICE_URL:http://booking-category:8080}
services.artist.url=${ARTIST_SERVICE_URL:http://artist:8080}
services.media.url=${PROMO_MEDIA_SERVICE_URL:http://promo-media:8080}